# Xiaomi Pad 8: the speaker sink has 4 channels, one per amp (RL FL RR FR,
# see pipewire.conf.d/50-yupei-pal.conf). Apps play stereo and their stream
# does the 2 -> 4 upmix; PipeWire's default "psd" method only puts ambience
# into the rear channels, so the bottom speakers were silent for normal
# video. "simple" copies left to both left speakers, right to both right.
stream.properties = {
    channelmix.upmix = true
    channelmix.upmix-method = simple
}
