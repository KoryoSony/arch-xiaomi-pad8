# The power key and the magnetic cover (xiaomi-hall lid switch) are handled in
# the GNOME session by yupei-powerkey: tap = lock + screen off / wake, hold =
# power-off dialog, cover = lock + screen off / wake. logind must not act (it
# would try to suspend, which doesn't work yet).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
