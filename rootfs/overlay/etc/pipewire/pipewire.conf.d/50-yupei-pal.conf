# Xiaomi Pad 8: replaces the AudioReach plugin's pw-pal-plugin.conf (not installed:
# audioreach/build-audioreach.sh). Only the outputs this tablet has; the
# compress-offload sink never reports a format and stalls WirePlumber (no
# stream gets linked), DP/HDMI and the voice-trigger source are untested.
context.modules = [
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_speaker_db"
        node.description = "Speakers"
        stream.props = {
            # WirePlumber treats these PAL streams as app streams, restores
            # saved props and waits for a reply the plugin never sends
            # (every later node and link then stalls).
            state.restore-props = false
            state.restore-target = false
            # Four amps on one 4-slot TDM link, in slot order: 0 = bottom
            # left, 1 = top left, 2/3 = right side (landscape). Named so that
            # PipeWire's simple upmix puts left on both left speakers and
            # right on both right ones; each channel reaches its amp unmixed
            # (PAL stream and device map are both FL FR LB RB).
            audio.position = [ RL FL FR RR ]
            channelmix.upmix = true
            channelmix.upmix-method = simple
        }
        media.class = "Audio/Sink"
        media.role = "music"
        jack-name = "Headset Jack"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_sink_headset_db"
        node.description = "Headphones"
        stream.props = {
            # WirePlumber treats these PAL streams as app streams, restores
            # saved props and waits for a reply the plugin never sends
            # (every later node and link then stalls).
            state.restore-props = false
            state.restore-target = false
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Sink"
        media.role = "music"
        jack-name = "Headset Jack"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_source_speaker_mic"
        node.description = "Microphone"
        stream.props = {
            # WirePlumber treats these PAL streams as app streams, restores
            # saved props and waits for a reply the plugin never sends
            # (every later node and link then stalls).
            state.restore-props = false
            state.restore-target = false
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Source"
        jack-name = "Headset Jack"
    }
},
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_source_headset_mic"
        node.description = "Headset microphone"
        stream.props = {
            # WirePlumber treats these PAL streams as app streams, restores
            # saved props and waits for a reply the plugin never sends
            # (every later node and link then stalls).
            state.restore-props = false
            state.restore-target = false
            audio.position = [ FL FR ]
        }
        media.class = "Audio/Source"
        jack-name = "Headset Jack"
    }
},
]
