# Copy log messages to the kernel log so yupei-bootlog -v shows them on the
# panel while booting (there is no VT/console to print to).
# Don't read the kernel log back: Xiaomi's vendor drivers log at error level
# continuously (the charger every 5 s, the status LED on every brightness
# step), which would flood the journal and keep it busy. Use dmesg for it.
[Journal]
ForwardToKMsg=yes
MaxLevelKMsg=info
ReadKMsg=no
