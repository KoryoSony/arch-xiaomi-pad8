[Unit]
After=yupei-display-quirks.service yupei-cpuinfo.service
Wants=yupei-display-quirks.service yupei-cpuinfo.service
Conflicts=yupei-desktop.service

[Service]
# The boot log viewer holds the display until the compositor takes over.
ExecStartPre=-/usr/bin/pkill -x yupei-bootlog
ExecStartPre=-/usr/bin/sleep 0.5
