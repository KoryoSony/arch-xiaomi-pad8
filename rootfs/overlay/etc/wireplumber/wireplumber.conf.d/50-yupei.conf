# Xiaomi Pad 8: Qualcomm's camera nodes (/dev/video*) are not V4L2 capture
# devices (QUERYCAP fails); enumerating them blocked WirePlumber's event queue,
# so no audio stream was ever linked. Cameras don't work on Linux yet anyway.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
