# The GKI kernel has no user namespaces (KMI constraint): drop the sandboxing
# that needs them, or upowerd (GNOME's battery indicator) never starts.
[Unit]
After=yupei-battery-guard.service
Wants=yupei-battery-guard.service

[Service]
PrivateUsers=no
# Xiaomi's MCA driver reports current_now with the sign inverted (negative =
# charging), so UPower showed "discharging" on the charger. yupei-battery-guard
# keeps the corrected value in /run/yupei/battery/current_now.
BindReadOnlyPaths=/run/yupei/battery/current_now:/sys/class/power_supply/battery/current_now
